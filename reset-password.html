<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - FinPessoal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/custom.css">
    <link rel="stylesheet" href="css/reset-password.css">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    
</head>
<body>

    <div class="reset-container">
        <div class="reset-card" id="reset-card">
            <!-- Logo -->
            <div class="reset-logo">
                Fin<span>Pessoal</span>
            </div>

            <!-- Título -->
            <h1 class="reset-title" id="page-title">Redefinir Senha</h1>
            <p class="reset-subtitle" id="page-subtitle">Digite sua nova senha abaixo.</p>

            <!-- Erro -->
            <div class="reset-error" id="reset-error"></div>

            <!-- Formulário -->
            <div id="reset-form">
                <div class="form-field">
                    <label>Nova Senha</label>
                    <input type="password" id="new-password" placeholder="Mínimo 6 caracteres" minlength="6">
                </div>
                <div class="form-field">
                    <label>Confirmar Senha</label>
                    <input type="password" id="confirm-password" placeholder="Digite a senha novamente" minlength="6">
                </div>
                <div class="reset-actions">
                    <button class="btn-reset" id="reset-btn" onclick="confirmReset()">
                        🔒 Redefinir Senha
                    </button>
                    <button class="btn-reset-secondary" onclick="window.location.href='login.html'">
                        ← Voltar para o login
                    </button>
                </div>
            </div>

            <!-- Sucesso -->
            <div id="reset-success" style="display:none;">
                <div class="reset-success">
                    <span class="icon">✅</span>
                    <h3>Senha redefinida com sucesso!</h3>
                    <p>Sua senha foi alterada. Você já pode fazer login com sua nova senha.</p>
                    <button class="btn-reset" style="margin-top:16px;" onclick="window.location.href='login.html'">
                        🔐 Ir para o Login
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // FIREBASE - CONFIGURAÇÃO
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBigrahjeSsAmj6KrZmkL700y6vGfCyyRc",
            authDomain: "fin-pessoal-fcbad.firebaseapp.com",
            projectId: "fin-pessoal-fcbad",
            storageBucket: "fin-pessoal-fcbad.firebasestorage.app",
            messagingSenderId: "1069646869368",
            appId: "1:1069646869368:web:d516e704888174eff94e8d",
            measurementId: "G-2LXG51D6RC"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // ============================================================
        // PEGA O CÓDIGO DA URL
        // ============================================================
        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode');
        const oobCode = urlParams.get('oobCode');

        // ============================================================
        // ELEMENTOS
        // ============================================================
        const form = document.getElementById('reset-form');
        const success = document.getElementById('reset-success');
        const errorDiv = document.getElementById('reset-error');
        const newPassword = document.getElementById('new-password');
        const confirmPassword = document.getElementById('confirm-password');
        const resetBtn = document.getElementById('reset-btn');

        // ============================================================
        // VERIFICA SE O CÓDIGO É VÁLIDO
        // ============================================================
        function showError(msg) {
            errorDiv.textContent = msg;
            errorDiv.classList.add('show');
            resetBtn.disabled = false;
            resetBtn.textContent = '🔒 Redefinir Senha';
        }

        function hideError() {
            errorDiv.classList.remove('show');
            errorDiv.textContent = '';
        }

        // Verifica o código
        if (mode !== 'resetPassword' || !oobCode) {
            showError('❌ Link inválido ou expirado. Solicite uma nova redefinição de senha.');
            resetBtn.disabled = true;
        } else {
            console.log('✅ Código válido, pronto para redefinir senha.');
        }

        // ============================================================
        // REDEFINIR SENHA
        // ============================================================
        function confirmReset() {
            hideError();

            const password = newPassword.value.trim();
            const confirm = confirmPassword.value.trim();

            // Validações
            if (!password || !confirm) {
                showError('❌ Preencha ambos os campos.');
                return;
            }

            if (password.length < 6) {
                showError('❌ A senha deve ter no mínimo 6 caracteres.');
                return;
            }

            if (password !== confirm) {
                showError('❌ As senhas não coincidem.');
                return;
            }

            // Desabilita botão
            resetBtn.disabled = true;
            resetBtn.textContent = '⏳ Aguarde...';

            // Confirma a redefinição
            auth.confirmPasswordReset(oobCode, password)
                .then(() => {
                    console.log('✅ Senha redefinida com sucesso!');
                    // Esconde o formulário e mostra o sucesso
                    form.style.display = 'none';
                    success.style.display = 'block';
                })
                .catch((error) => {
                    console.error('❌ Erro:', error.code, error.message);
                    let msg = '❌ Erro ao redefinir senha.';
                    if (error.code === 'auth/expired-action-code') {
                        msg = '❌ O link expirou. Solicite uma nova redefinição de senha.';
                    } else if (error.code === 'auth/invalid-action-code') {
                        msg = '❌ Link inválido. Solicite uma nova redefinição de senha.';
                    } else if (error.code === 'auth/weak-password') {
                        msg = '❌ A senha é muito fraca. Use pelo menos 6 caracteres.';
                    }
                    showError(msg);
                    resetBtn.disabled = false;
                    resetBtn.textContent = '🔒 Redefinir Senha';
                });
        }

        // ============================================================
        // ENTER PARA CONFIRMAR
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                if (!resetBtn.disabled && form.style.display !== 'none') {
                    confirmReset();
                }
            }
        });

        // ============================================================
        // ATUALIZA O TÍTULO
        // ============================================================
        if (mode !== 'resetPassword' || !oobCode) {
            document.getElementById('page-title').textContent = '❌ Link Inválido';
            document.getElementById('page-subtitle').textContent = 'O link de redefinição de senha é inválido ou expirou.';
        }
    </script>

</body>
</html>

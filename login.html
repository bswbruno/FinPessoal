<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinPessoal — Login</title>
    <link rel="stylesheet" href="css/style.css">

    <!-- ============================================================
         🔥 FIREBASE - CDN
    ============================================================ -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <!-- ============================================================
         🔥 FIREBASE - CONFIGURAÇÃO
    ============================================================ -->
    <script src="js/firebase-config.js"></script>
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">

            <!-- Logo -->
            <div class="auth-logo">
                Fin<span>Pessoal</span>
            </div>

            <!-- Título -->
            <h1 class="auth-title">Bem-vindo(a) 👋</h1>
            <p class="auth-subtitle">Faça login para continuar</p>

            <!-- Mensagem de erro/sucesso -->
            <div id="login-mensagem" class="auth-message"></div>

            <!-- Botão Google -->
            <button id="btn-google-login" class="btn-google">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Entrar com Google
            </button>

            <div class="auth-divider">
                <hr>
                <span>ou</span>
                <hr>
            </div>

            <!-- Formulário de Login -->
            <form id="form-login" class="auth-form">
                <div class="form-field">
                    <label>E-mail <span class="required">*</span></label>
                    <input type="email" id="login-email" placeholder="voce@email.com" required autocomplete="email">
                </div>
                <div class="form-field">
                    <label>Senha <span class="required">*</span></label>
                    <input type="password" id="login-senha" placeholder="Mínimo 6 caracteres" minlength="6" required autocomplete="current-password">
                </div>
                <button type="submit" id="login-submit-btn" class="btn-auth">
                    Entrar
                </button>
            </form>

            <!-- Links -->
            <div class="auth-links">
                <a href="#" id="link-recuperar">Esqueceu a senha?</a>
            </div>

            <!-- Link para cadastro -->
            <div class="auth-links auth-links-divider">
                <span class="text">Não tem uma conta?</span>
                <a href="register.html" class="link">Cadastre-se</a>
            </div>

        </div>
    </div>

    <!-- ============================================================
         🔥 SCRIPT DE LOGIN
    ============================================================ -->
    <script>
        // Verifica se o Firebase já está configurado
        const auth = firebase.auth();

        // Verifica se o usuário já está logado
        auth.onAuthStateChanged(function(user) {
            if (user) {
                console.log('✅ Usuário logado:', user.email);
                window.location.href = 'index.html';
            }
        });

        // Elementos
        const emailInput = document.getElementById('login-email');
        const senhaInput = document.getElementById('login-senha');
        const submitBtn = document.getElementById('login-submit-btn');
        const msgDiv = document.getElementById('login-mensagem');
        const googleBtn = document.getElementById('btn-google-login');
        const linkRecuperar = document.getElementById('link-recuperar');

        // ============================================================
        // FUNÇÃO PARA EXIBIR MENSAGEM
        // ============================================================
        function mostrarMensagem(texto, tipo) {
            msgDiv.textContent = texto;
            msgDiv.className = 'auth-message show';
            if (tipo === 'error') {
                msgDiv.classList.add('error');
            } else if (tipo === 'success') {
                msgDiv.classList.add('success');
            }
            console.log('📢 Mensagem:', texto);
        }

        // ============================================================
        // LOGIN COM E-MAIL/SENHA
        // ============================================================
        document.getElementById('form-login').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const senha = senhaInput.value.trim();

            if (!email || !senha) {
                mostrarMensagem('Preencha e-mail e senha!', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Entrando...';
            mostrarMensagem('', '');

            console.log('🔄 Tentando login com:', email);

            auth.signInWithEmailAndPassword(email, senha)
                .then(function(userCredential) {
                    console.log('✅ Login realizado!');
                    mostrarMensagem('✅ Login realizado!', 'success');
                    setTimeout(function() {
                        window.location.href = 'index.html';
                    }, 1000);
                })
                .catch(function(error) {
                    console.error('❌ Erro no login:', error.code, error.message);
                    
                    let mensagem = '';
                    switch (error.code) {
                        case 'auth/invalid-email':
                            mensagem = '❌ E-mail inválido. Verifique o formato.';
                            break;
                        case 'auth/user-not-found':
                            mensagem = '❌ Usuário não encontrado.';
                            break;
                        case 'auth/wrong-password':
                            mensagem = '❌ Senha incorreta. Tente novamente.';
                            break;
                        case 'auth/too-many-requests':
                            mensagem = '❌ Muitas tentativas. Aguarde um momento.';
                            break;
                        case 'auth/invalid-login-credentials':
                            mensagem = '❌ E-mail ou senha incorretos. Verifique e tente novamente.';
                            break;
                        default:
                            mensagem = '❌ Erro: ' + error.message;
                    }
                    
                    mostrarMensagem(mensagem, 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Entrar';
                });
        });

        // ============================================================
        // LOGIN COM GOOGLE
        // ============================================================
        googleBtn.addEventListener('click', function() {
            googleBtn.disabled = true;
            googleBtn.textContent = 'Aguarde...';
            mostrarMensagem('', '');

            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then(function(result) {
                    console.log('✅ Google:', result.user.email);
                    mostrarMensagem('✅ Login com Google!', 'success');
                    setTimeout(function() {
                        window.location.href = 'index.html';
                    }, 1000);
                })
                .catch(function(error) {
                    console.error('❌ Google:', error.code, error.message);
                    if (error.code !== 'auth/popup-closed-by-user') {
                        mostrarMensagem('❌ Erro no login com Google: ' + error.message, 'error');
                    }
                    googleBtn.disabled = false;
                    googleBtn.innerHTML = `
                        <svg width="20" height="20" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        Entrar com Google
                    `;
                });
        });

        // ============================================================
        // RECUPERAR SENHA
        // ============================================================
        linkRecuperar.addEventListener('click', function(e) {
            e.preventDefault();
            const email = emailInput.value.trim();

            if (!email) {
                mostrarMensagem('Digite seu e-mail para recuperar a senha.', 'error');
                return;
            }

            mostrarMensagem('Enviando...', '');

            auth.sendPasswordResetEmail(email)
                .then(function() {
                    mostrarMensagem('✅ Link de recuperação enviado para ' + email, 'success');
                })
                .catch(function(error) {
                    console.error('❌ Erro ao enviar:', error.code, error.message);
                    mostrarMensagem('❌ ' + error.message, 'error');
                });
        });

        console.log('✅ Login page carregada!');
    </script>

</body>
</html>
